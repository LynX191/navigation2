          obstacle_max_range: 7.0
          obstacle_min_range: 0.0

        obstacles_right:
          topic: /oak_right/obstacles
          max_obstacle_height: 0.4
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 7.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.0

        front_scan:
          topic: /front/scan
