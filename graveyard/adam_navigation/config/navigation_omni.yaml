bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    default_nav_to_pose_bt_xml: $(find-pkg-share adam_navigation)/behavior_trees/behavior_tree.xml


bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    controller_frequency: 30.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: "odom"
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 3.2
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      min_vel_x: -0.4
      min_vel_y: -0.4
      max_vel_x: 0.4
      max_vel_y: 0.4
      max_vel_theta: 0.0
      min_speed_xy: -0.4
      max_speed_xy: 0.4
      acc_lim_x: 0.4
      acc_lim_y: 0.4
      acc_lim_theta: 0.0
      decel_lim_x: -0.1
      decel_lim_y: -0.1
      decel_lim_theta: 0.0
      vx_samples: 30
      vy_samples: 30
      vtheta_samples: 0
      sim_time: 4.2
      short_circuit_trajectory_evaluation: True
      critics: ["PathDist", "GoalDist"]
      PathDist.scale: 32.0
      GoalDist.scale: 42.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.3
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.75
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: ground_front ground_left ground_right obstacles_front obstacles_left obstacles_right front_scan left_scan right_scan

        ground_front:
          topic: /oak_front/ground
          max_obstacle_height: 0.05
          clearing: true
          marking: False
          data_type: "PointCloud2"
          raytrace_max_range: 7.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.0

        ground_left:
          topic: /oak_left/ground
          max_obstacle_height: 0.05
          clearing: true
          marking: False
          data_type: "PointCloud2"
          raytrace_max_range: 7.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.0

        ground_right:
          topic: /oak_right/ground
