bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 50
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    default_nav_to_pose_bt_xml: $(find-pkg-share adam_navigation)/behavior_trees/omni_tunning.xml
    # default_nav_to_pose_bt_xml: $(find-pkg-share adam_navigation)/behavior_trees/odom_calibration.xml

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 20.0
    behavior_plugins:
      - "spin"
      - "backup"
      - "drive_on_heading"
      - "assisted_teleop"
      - "wait"
    spin:
      plugin: "nav2_behaviors/Spin"
      max_rotational_vel: 0.5      # Limit rotation speed (rad/s)
      min_rotational_vel: 0.2      # Minimum rotation speed
      rotational_acc_lim: 0.5      # Rotation acceleration limit
      time_allowance: 15.0         # Increased timeout
    backup:
      plugin: "nav2_behaviors/BackUp"
      simulate_ahead_time: 2.0
      backup_dist: 0.15
      backup_speed: 0.08
      time_allowance: 15.0
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
      simulate_ahead_time: 2.0
      speed: 0.4               # Set your desired speed
      time_allowance: 15.0     # Timeout for straight-line behavior
    wait:
      plugin: "nav2_behaviors/Wait"
      time_allowance: 5.0
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
      time_allowance: 15.0
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    use_sim_time: False
    simulate_ahead_time: 2.0

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"  # Correct plugin name (use "/" not "::")
      tolerance: 0.125                      # tolerance for planning if unable to reach exact pose, in meters
      downsample_costmap: false             # whether or not to downsample the map
      downsampling_factor: 1                # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
      allow_unknown: false                   # allow traveling in unknown space
      max_iterations: 1000000               # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000      # maximum number of iterations to attempt to reach goal once in tolerance
      max_planning_time: 2.0                # max time in s for planner to plan, smooth
      cost_travel_multiplier: 1.0           # Reduced for bypassing non-critical obstacles (was 2.0)
      use_final_approach_orientation: false # Whether to set the final path pose at the goal's orientation to the requested orientation (false) or in line with the approach angle so the robot doesn't rotate to heading (true)
      # smoother:
      #   max_iterations: 500                 # Reduced for faster processing
      #   w_smooth: 0.4                       # Increased to favor straighter paths
      #   w_data: 0.1                         # Reduced to allow more deviation for straight paths
      #   tolerance: 1.0e-8                   # Slightly relaxed tolerance

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    controller_patience: 5.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: "odom"
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 5.0
      movement_time_allowance: 10.0
    
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 5.0
    
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: -0.35
      min_vel_y: -0.35
      max_vel_x: 0.35
      max_vel_y: 0.35
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      acc_lim_x: 1.0
      acc_lim_y: 1.0
      decel_lim_x: -1.0
      decel_lim_y: -1.0
      vx_samples: 15
      vy_samples: 15
      sim_time: 2.0
      linear_granularity: 0.05
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 5.0
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      
      # Simplified critics for omni robot
      critics: ["Oscillation", "BaseObstacle", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 28.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0
      publish_frequency: 15.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.2
      # plugins: ["obstacle_layer", "inflation_layer"]
      plugins: ["obstacle_layer", "inflation_layer", "keepout_filter"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.628
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: ground_front ground_left ground_right obstacles_front obstacles_left obstacles_right front_scan left_scan right_scan

        ground_front:
          topic: /oak_front/ground
          max_obstacle_height: 0.05
          clearing: true
          marking: False
          data_type: "PointCloud2"
          raytrace_max_range: 7.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.0

        ground_left:
          topic: /oak_left/ground
          max_obstacle_height: 0.05
          clearing: true
          marking: False
          data_type: "PointCloud2"
          raytrace_max_range: 7.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.0

        ground_right:
          topic: /oak_right/ground
          max_obstacle_height: 0.05
          clearing: true
          marking: False
          data_type: "PointCloud2"
          raytrace_max_range: 7.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.0

        obstacles_front:
          topic: /oak_front/obstacles
          max_obstacle_height: 0.4
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 7.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.0

        obstacles_left:
          topic: /oak_left/obstacles
          max_obstacle_height: 0.4
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 7.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.0

        obstacles_right:
          topic: /oak_right/obstacles
          max_obstacle_height: 0.4
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 7.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.0

        front_scan:
          topic: /front/scan
          max_obstacle_height: 0.4
          clearing: true
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0

        left_scan:
          topic: /left/scan
          max_obstacle_height: 0.4
          clearing: true
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0

        right_scan:
          topic: /right/scan
          max_obstacle_height: 0.4
          clearing: true
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"

